<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dompetku - Pengelola Keuangan Keluarga</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen pb-12">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl">
                    <i class="fa-solid fa-wallet text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Dompetku & Keuangan Keluarga</h1>
                    <p class="text-xs text-indigo-200">Kelola & Pantau Anggaran dengan Mudah</p>
                </div>
            </div>
            <div>
                <button onclick="loadAndiFamilyData()" class="bg-emerald-500 hover:bg-emerald-600 text-white text-sm px-4 py-2 rounded-lg font-medium shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-file-excel"></i> Muat Data Oktober Andi Family
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 mt-8 space-y-8">

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Total Saldo -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">Sisa Saldo Bersih</p>
                    <h3 id="netBalance" class="text-2xl font-bold text-slate-900 mt-1">Rp 0</h3>
                </div>
                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-scale-balanced"></i>
                </div>
            </div>
            <!-- Total Pemasukan -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">Total Pemasukan</p>
                    <h3 id="totalIncome" class="text-2xl font-bold text-emerald-600 mt-1">Rp 0</h3>
                </div>
                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-arrow-down-long"></i>
                </div>
            </div>
            <!-- Total Pengeluaran -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-500">Total Pengeluaran</p>
                    <h3 id="totalExpense" class="text-2xl font-bold text-rose-600 mt-1">Rp 0</h3>
                </div>
                <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-xl flex items-center justify-center text-xl">
                    <i class="fa-solid fa-arrow-up-long"></i>
                </div>
            </div>
        </div>

        <!-- Grid Section: Form & Chart -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Input Form Card -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 lg:col-span-1">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-circle-plus text-indigo-600"></i> Tambah Transaksi
                </h2>
                <form id="transactionForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tipe Transaksi</label>
                        <select id="type" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="Pengeluaran">Pengeluaran</option>
                            <option value="Pemasukan">Pemasukan</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Keterangan / Catatan</label>
                        <input type="text" id="noted" required placeholder="Contoh: Belanja Bulanan, Gaji..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Jumlah Nominal (Rp)</label>
                        <input type="number" id="amount" required placeholder="Contoh: 150000" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tanggal</label>
                        <input type="date" id="date" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Pencatat</label>
                        <input type="text" id="pencatat" value="ANDI" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-xl transition shadow-md shadow-indigo-100">
                        Simpan Transaksi
                    </button>
                </form>
            </div>

            <!-- Chart Section -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 lg:col-span-2 flex flex-col justify-between">
                <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-indigo-600"></i> Visualisasi Pengeluaran Berdasarkan Catatan
                </h2>
                <div class="relative flex-grow flex items-center justify-center" style="min-height: 280px;">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>

        </div>

        <!-- History Transactions Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-indigo-600"></i> Riwayat Catatan Keuangan
                </h2>
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <button onclick="clearAllData()" class="text-xs text-rose-500 hover:text-rose-700 font-medium px-3 py-1.5 border border-rose-200 rounded-lg transition">
                        Reset Semua Data
                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="py-3 px-6 font-semibold">Tanggal</th>
                            <th class="py-3 px-6 font-semibold">Tipe</th>
                            <th class="py-3 px-6 font-semibold">Keterangan (Noted)</th>
                            <th class="py-3 px-6 font-semibold">Jumlah</th>
                            <th class="py-3 px-6 font-semibold">Pencatat</th>
                            <th class="py-3 px-6 text-center font-semibold">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTable" class="divide-y divide-slate-100 text-sm text-slate-600">
                        <!-- Data transaksi akan dimuat melalui Javascript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Javascript Logic -->
    <script>
        // Inisialisasi Default Data / LocalStorage
        let transactions = JSON.parse(localStorage.getItem('dompetku_transactions')) || [
            { id: 1, date: '2026-10-01', type: 'Pemasukan', noted: 'Gaji / Saldo Awal', amount: 5000000, pencatat: 'ANDI' }
        ];

        let expenseChartInstance = null;

        // Data bawaan dari spreadsheet Catatan Keuangan Andi Family (Oktober)
        const andiFamilyOktober = [
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'Resiko harian', amount: 70000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'BPJS ANDI', amount: 315000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'Spaylater', amount: 1369000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'Air & Sampah', amount: 85000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'Wifi Arjasari', amount: 150000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'Bpjs', amount: 100000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'Arisan', amount: 100000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'Rumah awal bulan', amount: 500000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'Lee mineral', amount: 23000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'Nasgor', amount: 46000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'Listrik', amount: 204000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'Rama', amount: 20000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'kuota amel', amount: 57000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'Perpanjang sim', amount: 250000, pencatat: 'ANDI' },
            { date: '2026-10-01', type: 'Pengeluaran', noted: 'tehdev tabungan', amount: 210000, pencatat: 'ANDI' }
        ];

        // Format ke Rupiah
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        // Set default date input hari ini
        document.getElementById('date').valueAsDate = new Date();

        // Render Dashboard & Tabel
        function updateUI() {
            const tableBody = document.getElementById('transactionTable');
            tableBody.innerHTML = '';

            let totalIncome = 0;
            let totalExpense = 0;
            let chartLabels = [];
            let chartData = [];

            // Sort berdasarkan tanggal terbaru
            transactions.sort((a, b) => new Date(b.date) - new Date(a.date));

            transactions.forEach((tx, index) => {
                if (tx.type === 'Pemasukan') {
                    totalIncome += Number(tx.amount);
                } else {
                    totalExpense += Number(tx.amount);
                    chartLabels.push(tx.noted);
                    chartData.push(Number(tx.amount));
                }

                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50/50 transition";
                row.innerHTML = `
                    <td class="py-3 px-6 font-medium text-slate-700">${tx.date}</td>
                    <td class="py-3 px-6">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${tx.type === 'Pemasukan' ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
                            ${tx.type}
                        </span>
                    </td>
                    <td class="py-3 px-6 text-slate-800 font-medium">${tx.noted}</td>
                    <td class="py-3 px-6 font-semibold ${tx.type === 'Pemasukan' ? 'text-emerald-600' : 'text-slate-800'}">
                        ${tx.type === 'Pemasukan' ? '+' : '-'} ${formatRupiah(tx.amount)}
                    </td>
                    <td class="py-3 px-6 text-slate-500">${tx.pencatat || 'ANDI'}</td>
                    <td class="py-3 px-6 text-center">
                        <button onclick="deleteTransaction(${index})" class="text-slate-400 hover:text-rose-600 transition p-1">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(row);
            });

            // Update Ringkasan Saldo
            let netBalance = totalIncome - totalExpense;
            document.getElementById('totalIncome').innerText = formatRupiah(totalIncome);
            document.getElementById('totalExpense').innerText = formatRupiah(totalExpense);
            
            const netBalanceEl = document.getElementById('netBalance');
            netBalanceEl.innerText = formatRupiah(netBalance);
            netBalanceEl.className = `text-2xl font-bold mt-1 ${netBalance >= 0 ? 'text-slate-900' : 'text-rose-600'}`;

            // Simpan ke LocalStorage
            localStorage.setItem('dompetku_transactions', JSON.stringify(transactions));

            // Update Chart
            updateChart(chartLabels, chartData);
        }

        // Tambah Transaksi dari Form
        document.getElementById('transactionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newTx = {
                date: document.getElementById('date').value,
                type: document.getElementById('type').value,
                noted: document.getElementById('noted').value,
                amount: parseFloat(document.getElementById('amount').value),
                pencatat: document.getElementById('pencatat').value
            };

            transactions.push(newTx);
            updateUI();

            // Reset form input teks & nominal
            document.getElementById('noted').value = '';
            document.getElementById('amount').value = '';
        });

        // Hapus Transaksi
        function deleteTransaction(index) {
            transactions.splice(index, 1);
            updateUI();
        }

        // Reset Semua Data
        function clearAllData() {
            if (confirm('Apakah Anda yakin ingin menghapus seluruh riwayat data?')) {
                transactions = [];
                updateUI();
            }
        }

        // Muat Data Andi Family Oktober
        function loadAndiFamilyData() {
            if (confirm('Muat data pengeluaran bulan Oktober dari spreadsheet Andi Family?')) {
                // Tambahkan data andiFamilyOktober ke dalam array transaksi saat ini
                andiFamilyOktober.forEach(item => {
                    transactions.push(item);
                });
                updateUI();
                alert('Data pengeluaran Oktober berhasil dimuat!');
            }
        }

        // Fungsi Render Chart.js
        function updateChart(labels, data) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            if (expenseChartInstance) {
                expenseChartInstance.destroy();
            }

            expenseChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#6366f1', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', 
                            '#8b5cf6', '#ef4444', '#14b8a6', '#f97316', '#06b6d4',
                            '#84cc16', '#d946ef', '#64748b', '#0ea5e9', '#eab308'
                        ],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                boxWidth: 12,
                                font: { size: 11 }
                            }
                        }
                    }
                }
            });
        }

        // Load pertama kali saat halaman dibuka
        updateUI();
    </script>
</body>
</html>
